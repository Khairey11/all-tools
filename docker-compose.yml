version: "3.9"
services:
  localai:
    image: quay.io/go-skynet/local-ai:latest
    ports:
      - "8080:8080"
    environment:
      - MODELS_PATH=/models
      - THREADS=4
      # You can disable these if you only want code models
      - COMPEL=0 
    volumes:
      - ./local-ai-models:/models
    command: ["--models-path", "/models", "--cors"]
